<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor/View Schedule Status Update</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            margin: 20px 0;
        }

        td {
            padding: 10px;
            text-align: left;
        }

        select, input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: #f9f9f9;
        }

        select:focus, input[type="submit"]:focus {
            outline: none;
            border-color: #007bff;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        label {
            font-size: 18px;
            color: #555;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Update Schedule Status</h1>
        <form id="form1" name="form1" method="post" action="/schedule_status_reply">
            <table>
                <tr>
                    <td><label for="status">Status</label></td>
                    <td>
                        <select name="textfield" id="status">
                            <option value="select">Select</option>
                            <option value="Available">Available</option>
                            <option value="NotAvailable">Not Available</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" name="Submit" value="Send" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
