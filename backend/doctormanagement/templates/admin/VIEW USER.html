<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin -- View User</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
         *{
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;

        }
         header {
            padding: 20px;
            text-align: center;
            background-color: #007bff;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .search-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search-container input[type="text"] {
            padding: 10px;
            width: 300px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        .search-container input[type="text"]:focus {
            border-color: #28a745;
            outline: none;
        }
        .search-container input[type="submit"] {
            padding: 10px 20px;
            background-color: #28a745;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .search-container input[type="submit"]:hover {
            background-color: #218838;
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px;
            width: 250px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .card h3 {
            margin: 0;
            font-size: 1.5em;
            color: #333;
        }
        .card p {
            margin: 5px 0;
            color: #555;
        }
        .no-results {
            text-align: center;
            color: #888;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <header>
        <h1>View Users</h1>
    </header>

    <div class="search-container">
        <form id="form1" name="form1" method="post" action="{% url 'search_user' %}">
            <input type="text" name="textfield" value="{{ search_query }}" placeholder="Search by Name" />
            <input type="submit" name="Submit" value="SEARCH" />
        </form>
    </div>

    <div class="card-container">
        {% if values %}
            {% for i in values %}
            <div class="card">
                <h3>{{ i.Name }}</h3>
                <p><strong>Address:</strong> {{ i.POST }} {{ i.PLACE }} {{ i.PIN }}</p>
                <p><strong>Phone:</strong> {{ i.PHONE }}</p>
                <p><strong>Email:</strong> {{ i.EMAIL }}</p>
            </div>
            {% endfor %}
        {% else %}
            <div class="no-results">
                <p>No results found.</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
