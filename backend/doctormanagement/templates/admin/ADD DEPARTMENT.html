<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin -- Add Department</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 40px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            margin: auto;
            transition: transform 0.3s;
        }
        .form-container:hover {
            transform: scale(1.02);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: 93%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: border 0.3s, box-shadow 0.3s, background-color 0.3s;
        }
        input[type="text"]:focus {
            border: 2px solid #5cb85c;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(92, 184, 92, 0.6);
            outline: none;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        input[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form id="addDepartmentForm" name="addDepartmentForm" method="post" action="add_department_post">
            <h2>Add Department</h2>
            <label for="departmentName">Department</label>
            <input type="text" id="departmentName" name="textfield" required pattern="[A-Za-z\s.]{3,25}" />

            <label for="departmentDetails">Details</label>
            <input type="text" id="departmentDetails" name="textfield2" required pattern="[A-Za-z\s.]{3,25}" />

            <input type="submit" name="Submit" value="Add" />
        </form>
    </div>
</body>
</html>
