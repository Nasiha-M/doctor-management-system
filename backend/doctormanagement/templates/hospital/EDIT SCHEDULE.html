<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Schedule</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            font-size: 2em;
            color: #4CAF50;
            margin-top: 0;
            font-weight: 700;
        }
        .form-container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            margin-bottom: 20px;
            border-collapse: collapse;
        }
        td {
            padding: 12px;
            text-align: left;
            font-size: 1em;
        }
        td:first-child {
            width: 30%;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            background-color: #fafafa;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input[type="time"], input[type="date"] {
            width: 96%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            background-color: #fafafa;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        select {
            cursor: pointer;
        }
        input[type="text"]:focus, input[type="time"]:focus, input[type="date"]:focus, select:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.2);
            outline: none;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 6px;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        input[type="submit"]:active {
            background-color: #388e3c;
            transform: translateY(2px);
        }
        label {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        .center {
            text-align: center;
        }
        .form-row {
            margin-bottom: 20px;
        }
        .form-row select, .form-row input {
            font-size: 1em;
            border: 1px solid #ddd;
            transition: border-color 0.3s ease;
        }
    </style>
</head>

<body>

<div class="form-container">
    <h1>Edit Schedule</h1>

    <form id="form1" name="form1" method="post" action="">
        {% csrf_token %}

        <div class="form-row">
            <label for="DoctorID">Doctor</label>
            <select name="DoctorID" id="DoctorID" required>
                <option value="">Select a doctor</option>
                {% for doctor in doctors %}
                    <option value="{{ doctor.id }}" {% if doctor.id == schedule.DoctorID.id %}selected{% endif %}>{{ doctor.Name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <label for="FromTime">From Time</label>
            <input type="time" name="FromTime" id="FromTime" value="{{ schedule.FromTime|time:"H:i" }}" required />
        </div>

        <div class="form-row">
            <label for="ToTime">To Time</label>
            <input type="time" name="ToTime" id="ToTime" value="{{ schedule.ToTime|time:"H:i" }}" required />
        </div>

        <div class="form-row">
            <label for="Date">Date</label>
            <input type="date" name="Date" id="Date" value="{{ schedule.Date|date:"Y-m-d" }}" required />
        </div>

        <div class="form-row center">
            <input type="submit" value="Save" />
        </div>
    </form>
</div>

</body>
</html>
