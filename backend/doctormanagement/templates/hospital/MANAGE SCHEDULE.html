<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital / Manage Schedule</title>
  <style>
    /* Global Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    /* Form Styles */
    form {
      width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
    }

    /* Title inside the form */
    h1 {
      text-align: center;
      color: #27ae60;
      margin-bottom: 40px;
      font-size: 2.5em;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    /* Flexbox Layout for Input and Button */
    .search-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .search-container input[type="text"] {
      width: 93%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
    }

    .search-container input[type="submit"] {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-left: 10px;
    }

    .search-container input[type="submit"]:hover {
      background-color: #2980b9;
    }

    /* Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ddd;
    }

    th {
      background-color: #3498db;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      background-color: #ffffff;
      color: #333;
    }

    td a {
      text-decoration: none;
      color: #3498db;
      font-weight: bold;
    }

    td a:hover {
      color: #2980b9;
    }

    /* Add New Button */
    .add-new-btn {
      display: inline-block;
      background-color: #2ecc71;
      color: white;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .add-new-btn:hover {
      background-color: #27ae60;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      form {
        width: 90%;
      }

      table {
        font-size: 14px;
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 24px;
      }

      form {
        width: 95%;
      }

      table th, table td {
        padding: 10px;
      }
    }

    @media (max-width: 480px) {
      input[type="text"], input[type="submit"] {
        font-size: 14px;
        padding: 10px;
      }

      table th, table td {
        font-size: 12px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <form id="form1" name="form1" method="post" action="{% url 'search_doctor' %}">
    <h1>Manage Schedule</h1>

    <div class="form-group search-container">
      <input type="text" name="textfield" value="{{ search_query }}" id="textfield" placeholder="Search by Doctor's Name..." />
      <input type="submit" name="Submit" value="SEARCH" />
    </div>

    <table>
      <thead>
        <tr>
          <th>NAME</th>
          <th>FROM TIME</th>
          <th>TO TIME</th>
          <th>DATE</th>
          <th>OPTIONS</th>
        </tr>
      </thead>
      <tbody>
        {% for i in values %}
          <tr>
            <td>{{ i.DoctorID.Name }}</td>
            <td>{{ i.FromTime }}</td>
            <td>{{ i.ToTime }}</td>
            <td>{{ i.Date }}</td>
            <td>
              <a href="edit_schedule/{{ i.id }}">EDIT</a> |
              <a href="delete_schedule/{{ i.id }}">DELETE</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

    <!-- Link to Add New Schedule -->
    <div class="form-group" style="text-align: center;">
      <a href="add_schedule" class="add-new-btn">ADD NEW</a>
    </div>
  </form>

</body>
</html>
