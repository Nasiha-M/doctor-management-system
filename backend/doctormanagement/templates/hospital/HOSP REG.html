<html>
<head>
    <meta charset="utf-8">
    <title>Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            color: #FFFFFF;
            background-image: url("../../static/design/img/loginbg.jpg");
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 36px;
        }
        form{
            position: absolute;
            top: 50px;
            left: 150px;
        }
        i{
            font-style: normal;
            opacity: .7;
            margin-left: 10px;
        }
        .form-wrapper {
            margin-bottom: 15px;
        }
        input[type="text"], input[type="email"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ffffff;
            border-top:none;
            border-left: none;
            border-right: none;
            background: transparent;
            font-size: 17px;
            font-weight: 500;
            color: #fff;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            border-color: #ffd900;
            outline: none;
        }
        ::placeholder {
            color: #FFFFFF;
            opacity: 0.7;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #1a76d1;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        button:hover {
            background-color: #ffd900;
            color: #1a76d1;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="inner">
            <form id="form1" name="form1" method="post" action="/hospital_registration_post" enctype="multipart/form-data">
                <h2>Registration Form</h2>
                <div class="form-wrapper">
                    <input type="text" placeholder="Full Name" class="form-control" name="name" pattern="[A-Z a-z.]{3,25}" required>
                </div>
                <div class="form-wrapper">
                    <input type="text" placeholder="Place" class="form-control" name="place" pattern="[A-Z a-z.]{3,25}" required>
                </div>
                <div class="form-wrapper">
                    <input type="text" placeholder="Post" class="form-control" name="post" pattern="[A-Z a-z.]{3,25}" required>
                </div>
                <div class="form-wrapper">
                    <input type="text" placeholder="Pin" class="form-control" name="pin" required pattern="[0-9]{6}">
                </div>
                <div class="form-wrapper">
                    <input type="text" placeholder="Phone Number" class="form-control" name="phone" required pattern="[678 9][0-9]{9}">
                </div>
                <div class="form-wrapper">
                    <input type="email" placeholder="Email" class="form-control" name="e-mail" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}">
                </div>
                <div class="form-wrapper">
                    <i>Hospital Image</i>
                    <input type="file" class="form-control" name="image" required>
                </div>
                <div class="form-wrapper">
                    <input type="text" placeholder="Latitude" class="form-control" name="latitude" required>
                </div>
                <div class="form-wrapper">
                    <input type="text" placeholder="Longitude" class="form-control" name="longitude" required>
                </div>
                <div class="form-wrapper">
                    <input type="text" placeholder="Username" class="form-control" name="username" required>
                </div>
                <div class="form-wrapper">
                    <input type="password" placeholder="Password" class="form-control" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
                </div>
                <button type="submit" name="Submit">Register</button>
            </form>
        </div>
    </div>

    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-23581568-13"></script>

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

</body>
</html>
